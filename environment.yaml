name: cat2
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Python 3.11+ is required. Snakemake must be >=9: snakemake 8.x silently
  # corrupts multi-line f-strings inside rule `run:` blocks under Python 3.12
  # (it drops physical lines, e.g. the `python cat/consensus_runner.py`
  # invocation), which was fixed in the 9.x parser. Do not downgrade snakemake
  # below 9 on Python >=3.12.
  - python >=3.11,<3.13
  - pip
  # Python packages
  - toil >=7.0.0
  - seaborn >=0.13.0
  - pandas >=2.0.0
  - frozendict >=2.4.1
  - configobj >=5.0
  - sqlalchemy >=2.0
  - ete3 >=3.0
  - pysam >=0.19.1
  - numpy >=2.2.0
  - scipy >=1.13.3
  - bx-python >=0.13
  - gffutils >=0.10
  - biopython >=1.76
  - intervaltree >=3.1
  # Workflow orchestration
  - snakemake >=9.0
  # Bioinformatics tools
  - augustus
  - stringtie
  - minimap2
  - diamond
  - samtools >=1.15
  - bedtools
  - gffread
  - miniprot
  - minisplice
  - pal2nal
  # UCSC genome browser tools
  - ucsc-axtchain
  - ucsc-bamtopsl
  - ucsc-bedsort
  - ucsc-bedtobigbed
  - ucsc-chainmergesort
  - ucsc-chainnet
  - ucsc-chainsort
  - ucsc-fasize
  - ucsc-fatotwobit
  - ucsc-genepredtobed
  - ucsc-genepredtogtf
  - ucsc-gff3togenepred
  - ucsc-gtftogenepred
  - ucsc-liftover
  - ucsc-netchainsubset
  - ucsc-netfilter
  - ucsc-netsyntenic
  - ucsc-pslcdnafilter
  - ucsc-pslcheck
  - ucsc-pslmap
  - ucsc-pslrecalcmatch
  - ucsc-wigtobigwig
  - pip:
    # parasail (SW aligner C-extension) is more reliably obtained from PyPI
    # wheels than conda for this platform; install it (with its deps) first.
    - parasail >=1.3.4
    # Install cat2 package only; conda deps above must not be re-resolved by pip.
    - --no-deps
    - -e .
